# 1. 觸發時機：當有程式碼 Push 到專案，或是有人發起 Pull Request 時啟動檢查
on: [push, pull_request]

# 2. 權限設定：因為我們改成「只檢查、不自動修改 Push」，所以只需要讀取權限即可（最安全）
permissions:
  contents: read

jobs:
  python-lint:
    # 指定執行環境為最新版的 Ubuntu 虛擬機
    runs-on: ubuntu-24.04
    name: CI 程式碼品質檢查

    steps:
      # 步驟一：把你的專案程式碼下載到這台虛擬機裡面
      - name: 取得專案程式碼 (Checkout)
        uses: actions/checkout@v6

      # 步驟二：在虛擬機裡面安裝 Python 環境
      - name: 安裝 Python 環境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11' # 可依你專案需求調整版本，例如 '3.10' 或 '3.12'

      # 步驟三：安裝檢查工具（如果專案有 requirements.txt 也可以在這裡一起安裝）
      - name: 安裝 Linter 檢查工具
        run: |
          python -m pip install --upgrade pip
          pip install flake8 mypy isort
          pip install google-genai python-dotenv

      # 步驟四：開始執行三項程式碼檢查（任何一項沒過就會亮紅燈擋下）
      - name: 執行程式碼檢查 (Linting)
        run: |
          # 1. 檢查程式碼風格與排版（設定單行最長不超過 127 個字元）
          flake8 . --max-line-length=127
          
          # 2. 檢查變數型別標註是否正確
          mypy .
          
          # 3. 檢查 import 排序（加上 --check-only 代表「只檢查不自動修改」，不符規定就報錯）
          isort --check-only .

      # 步驟五： 執行 Gemini AI 程式碼審查
      - name: 執行 Gemini AI 程式碼審查
        env:
          # 從 GitHub Secrets 讀取金鑰注入環境變數
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python ai_review.py